services:
  app:
    build:
      context: ./docker/php
    container_name: dms_app
    volumes:
      - ./src:/var/www/html
    working_dir: /var/www/html
    depends_on:
      - db

  webserver:
    image: nginx:stable-alpine
    container_name: dms_nginx
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mariadb:11
    container_name: dms_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: dms
      MYSQL_USER: dms_user
      MYSQL_PASSWORD: dms_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3306:3306"
    volumes:
      - dms_db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: dms_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root_pass
    ports:
      - "8081:80"
    depends_on:
      - db

  node:
    image: node:22-alpine
    container_name: dms_node
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    # 通常は起動しっぱなしにせず、必要な時だけ `docker compose run` で使う
    profiles:
      - tools
    command: sh -c "npm install && npm run build"

volumes:
  dms_db_data:
