services:
  app:
    build:
      context: ./docker/php
    container_name: dms_app
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html
      # 証憑ファイルはソースツリーの外(./data)に置く。デプロイ(rsync/git)で消えない・誤公開されない
      - ./data/transaction:/var/www/html/storage/app/transaction
    working_dir: /var/www/html
    depends_on:
      db:
        condition: service_healthy

  webserver:
    image: nginx:stable-alpine
    container_name: dms_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www/html:ro   # nginx は読み取りのみ。証憑ディレクトリはマウントしない
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mariadb:11
    container_name: dms_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-dms}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    # ホストからのみ接続可（外部から3306を直接叩けないようにする）
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - dms_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: dms_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      # PMA_USER/PMA_PASSWORD は設定しない（root自動ログインをやめ、ログイン画面で認証する）
    # ホストからのみ。外から使う場合は SSH トンネル: ssh -L 8081:127.0.0.1:8081 user@server
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - db

  node:
    image: node:22-alpine
    container_name: dms_node
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    # 通常は起動しっぱなしにせず、必要な時だけ `docker compose run` で使う
    profiles:
      - tools
    command: sh -c "npm install && npm run build"

volumes:
  dms_db_data:
